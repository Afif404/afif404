  <rect width="1200" height="460" fill="url(#vignette)"/>

  <!-- top bar, like the site -->
  <g class="up">
    <circle class="dot" cx="62" cy="58" r="3.5" fill="#00D1FF"/>
    <text class="mono" x="76" y="62">23.81°N 90.41°E</text>
    <text class="mono" x="1140" y="62" text-anchor="end">DHAKA · UTC+6</text>
  </g>
  <line x1="56" x2="1144" y1="86" y2="86" stroke="#1A1D22"/>

  <g class="up d1"><text class="mono" x="60" y="170">FULL-STACK &amp; AI ENGINEER</text></g>
  <g class="up d2">
    <text x="56" y="262" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" letter-spacing="-4">
      <tspan font-weight="700" fill="url(#shine)">Afif</tspan><tspan dx="22" font-weight="300" fill="none" stroke="#EDEFF2" stroke-width="1.2" class="draw">Alamgir</tspan>
    </text>
  </g>
  <g class="up d3">
    <text x="60" y="318" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#6B7280">I build SaaS platforms, CRMs and AI pipelines, from the Postgres schema to the interface.</text>
  </g>

  <g class="up d4">
    <text class="mono" x="60" y="414">AFIFALAMGIR.COM ↗</text>
    <text class="mono" x="1114" y="414" text-anchor="end">SCROLL</text>
