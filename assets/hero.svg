<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Afif Alamgir, full-stack and AI engineer">
<defs>
  <clipPath id="frame"><rect width="1200" height="460" rx="20"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <linearGradient id="strokeFade" x1="0" x2="1">
    <stop offset="0" stop-color="#00D1FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00D1FF"/>
    <stop offset="1" stop-color="#00D1FF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-600" x2="0" y1="0" y2="0">
    <stop offset="0" stop-color="#EDEFF2"/>
    <stop offset=".45" stop-color="#EDEFF2"/>
    <stop offset=".5" stop-color="#00D1FF"/>
    <stop offset=".55" stop-color="#EDEFF2"/>
    <stop offset="1" stop-color="#EDEFF2"/>
    <animate attributeName="x1" values="-600;1200" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1800" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#EDEFF2" stroke-opacity=".035"/>
  </pattern>
  <radialGradient id="vignette" cx=".5" cy=".4" r=".75">
    <stop offset=".55" stop-color="#030405" stop-opacity="0"/><stop offset="1" stop-color="#030405"/>
  </radialGradient>
</defs>
<style>
  .mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;letter-spacing:.08em;fill:#6B7280}
  .up{opacity:0;animation:up 1.1s cubic-bezier(.2,.7,.1,1) forwards}
  .d1{animation-delay:.15s} .d2{animation-delay:.35s} .d3{animation-delay:.6s} .d4{animation-delay:.9s}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.6s .5s cubic-bezier(.6,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .dot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .scroll{animation:drop 2.2s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes drop{0%{transform:translateY(-14px);opacity:0}40%{opacity:1}100%{transform:translateY(14px);opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="460" fill="#030405"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <g filter="url(#blur)" opacity=".5">
